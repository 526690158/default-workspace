acc:
  id: agent-d5upd8
  version: 0.1.0
  type: agent
  capability: 物流运单监控与异常处理
  owner:
    team: auto
    human_owner: 待定
    agent_owner: lead
  purpose: 负责监控每日物流运单状态，处理常规的物流延误异常；当客户询问物流进度时，检索 ERP 给出预计到达时间；每日下午 5 点生成当天的物流异常报表。遇到重大延误（超过 24 小时），提出补偿方案。
  non_purpose: 绝对不允许直接给客户退款；绝对不允许擅自修改物流合同价格；绝对不允许承诺无法兑现的到达时间。
  autonomy:
    level: L3
    policy: default-enterprise
  tools:
    allow:
      - name: erp.read
      - name: web.search
      - name: report.generate
    deny: []
  data_scope: []
  memory:
    short_term: session
    long_term:
      write: false
      retention_days: 90
  verification:
    oracles: []
    accuracy_threshold: 0.9
  human_interaction:
    ambiguity: escalate
    risk_level_above: L2
  observability:
    audit: full
  identity:
    account: agent-d5upd8
  responsibility:
    accountable_to: 待定
    audit: full
